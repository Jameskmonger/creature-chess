events {
  worker_connections 1024;
}

http {
	include    /etc/nginx/mime.types;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	server {
		server_name creature-chess-local;

		listen 80;

		# images get served from /html/images
		location /images/ {
            root /usr/share/nginx/html/;
        }

		# we need to proxy the socket.io connection to the game server
		# rather than loading the static game files
		location /game/socket.io/ {
			proxy_pass 				http://server-game:3000/socket.io/;
			proxy_http_version 		1.1;

			proxy_set_header 		Upgrade 				$http_upgrade;
			proxy_set_header 		Connection 				"Upgrade";
			proxy_set_header 		Host 					$host;
			proxy_set_header 		X-Real-IP  				$remote_addr;
			proxy_set_header   		X-Forwarded-For 		$proxy_add_x_forwarded_for;
			proxy_set_header   		X-Forwarded-Proto 		$scheme;
		}

		# Proxy Prometheus metrics to the game server
		location /metrics {
			proxy_pass http://server-game:3000/metrics;
			proxy_http_version 1.1;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Plugin asset overlay
		location ~ ^/plugins/(@[^/]+/[^/]+|[^/]+)/(.+\.(?:js|css|map))$ {
			root /;
			# Three-layer resolution:
			#   1. /mods/    - operator overlay (always honoured)
			#   2. /workspace-builtin/ - dev overlay (only exists when
			#      docker-compose.dev.yml is layered in); empty in prod.
			#   3. /builtin/ - image-baked tree (always exists in prod;
			#      still present in dev because the workspace mount is a
			#      separate path, so a workspace plugin that hasn't been
			#      `yarn nx build:web`'d locally falls through to the
			#      image's working version instead of 404'ing).
			try_files /mods/$1/dist/web/$2
			          /workspace-builtin/$1/dist/web/$2
			          /builtin/$1/dist/web/$2
			          =404;
			add_header Cache-Control "no-cache";
			types { text/javascript js; text/css css; application/json map; }
			default_type text/javascript;
		}

		# Plugin-owned static assets (images/, etc.). Same three-layer
		# resolution as the JS bundle rule above.
		location ~ ^/plugins/(@[^/]+/[^/]+|[^/]+)/(images/.+)$ {
			root /;
			try_files /mods/$1/$2
			          /workspace-builtin/$1/$2
			          /builtin/$1/$2
			          =404;
			add_header Cache-Control "public, max-age=3600";
		}

		# /api/* should go to http://server-info:3000/
		location /api/ {
			proxy_pass 				http://server-info:3000/;
			proxy_http_version 		1.1;

			proxy_set_header 		Host 					$host;
			proxy_set_header 		X-Real-IP  				$remote_addr;
			proxy_set_header   		X-Forwarded-For 		$proxy_add_x_forwarded_for;
			proxy_set_header   		X-Forwarded-Proto 		$scheme;
		}

		# A mod may drop `location` snippets at <mod>/nginx/*.conf
		# to expose its own HTTP routes through this gateway
		# (so they're served on the same origin, behind any CDN).
		include /mods/*/nginx/*.conf;
		include /mods/*/*/nginx/*.conf;

		# The client-safe plugin manifest lives in the SPA.
		location = /plugins/manifest.json {
			root /usr/share/nginx/html/web-game;
			add_header Cache-Control "no-cache";
			default_type application/json;
		}

		# Pre-game creature catalog
		location = /plugins/creatures.json {
			root /usr/share/nginx/html/web-game;
			add_header Cache-Control "no-cache";
			default_type application/json;
		}

		# otherwise just serve the menu files
		location / {
			root /usr/share/nginx/html/web-game;

			try_files $uri $uri/ /index.html =404;

			# Set cache control headers for HTML and JS files
			add_header Cache-Control "public, max-age=3600, must-revalidate";
			types {
				text/html html;
				text/javascript js;
			}

			# Enable gzip compression for HTML and JS files
			gzip on;
			gzip_types text/html text/javascript;
		}
	}
}
