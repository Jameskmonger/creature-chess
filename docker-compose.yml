networks:
  creature-chess:
    name: creature-chess
    internal: true
  public: {}

services:
  # Base image for all nodejs-based apps
  nodejs-base:
    build:
      context: .
      dockerfile: apps/nodejs-base.Dockerfile
    image: local/nodejs-base
    networks:
      - creature-chess

  # Server base image with server-specific dependencies
  server-base:
    build:
      context: .
      dockerfile: apps/server-base.Dockerfile
    image: local/server-base
    networks:
      - creature-chess
    depends_on:
      nodejs-base:
        condition: service_completed_successfully

  # Web base image with web-specific dependencies
  web-base:
    build:
      context: .
      dockerfile: apps/web-base.Dockerfile
    image: local/web-base:latest
    networks:
      - creature-chess
    depends_on:
      nodejs-base:
        condition: service_completed_successfully

  # Web game builder service
  web-game-builder:
    build:
      context: .
      dockerfile: apps/web.Dockerfile
      args:
        APP_DIR: web-game
        # Webpack bakes these into the bundle at build time, so they must be build args.
        NODE_ENV: ${NODE_ENV}
        API_INFO_URL: ${API_INFO_URL}
        CREATURE_CHESS_APP_URL: ${CREATURE_CHESS_APP_URL}
        CREATURE_CHESS_IMAGE_URL: ${CREATURE_CHESS_IMAGE_URL}
    image: local/web-game:latest
    volumes:
      - ./dist/web-game:/output
    networks:
      - creature-chess
    depends_on:
      web-base:
        condition: service_completed_successfully

  # Game server
  server-game:
    build:
      context: .
      dockerfile: apps/server.Dockerfile
      args:
        APP_DIR: server-game
    volumes:
      - ./metrics:/var/creature-chess/metrics:rw
    image: local/server-game:latest
    environment:
      - CREATURE_CHESS_APP_URL
      - API_INFO_URL
      - INFO_API_INTERNAL_URL
      - CREATURE_CHESS_IMAGE_URL
      - NODE_ENV
      - NODE_APP_INSTANCE
      - METRICS_USERNAME
      - METRICS_PASSWORD
    ports:
      - "3000"
    networks:
      - creature-chess
    restart: always
    depends_on:
      server-base:
        condition: service_completed_successfully

  # Info API server
  server-info:
    build:
      context: .
      dockerfile: apps/server.Dockerfile
      args:
        APP_DIR: server-info
    image: local/server-info:latest
    environment:
      - CREATURE_CHESS_APP_URL
      - NODE_ENV
    ports:
      - "3000"
    networks:
      - creature-chess
    restart: always
    depends_on:
      server-base:
        condition: service_completed_successfully

  # Nginx reverse proxy and static file server
  nginx:
    build:
      context: .
      dockerfile: nginx/local-dev/Dockerfile
    volumes:
      - ./nginx/local-dev/nginx/error.log:/etc/nginx/error_log.log
      - ./nginx/local-dev/nginx/access.log:/etc/nginx/access_log.log
      - ./images:/usr/share/nginx/html/images
      - ./dist/web-game:/usr/share/nginx/html/web-game
    ports:
      - 80:80
      - 443:443
    networks:
      - creature-chess
      - public
    depends_on:
      web-game-builder:
        condition: service_completed_successfully
      server-game:
        condition: service_started
      server-info:
        condition: service_started
